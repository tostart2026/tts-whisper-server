services:
  # ---------- Web: nginx 静态页面 + 反向代理 ----------
  # kokoro(TTS) 与 faster-whisper(ASR) 均已直接运行在宿主机上，
  # 因此 nginx 通过 host.docker.internal 反代到宿主机端口。
  web:
    image: docker.1panel.live/library/nginx:stable-alpine
    container_name: tts-whisper-web
    restart: always
    ports:
      - "2080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
