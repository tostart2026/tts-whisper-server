[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "faster-whisper-server"
version = "0.0.2"
description = "OpenAI-compatible FastAPI server for faster-whisper"
authors = [{name = "andyjjrt"}]
requires-python = ">=3.10"
license = {"file = "LICENSE"}
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "faster-whisper>=1.2.1",
    "pyyaml>=6.0.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
faster-whisper-server = "faster_whisper_server.__main__:main"